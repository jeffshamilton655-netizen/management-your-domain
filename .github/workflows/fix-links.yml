name: Restore website links
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/fix-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore intended link destinations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav={'Skip to content':'#main','MANAGEMENT':'#home','Home':'#home','About the Artist':'#about','Media / Gallery':'#media','Explore':'#explore','Management':'#management','Contact':'#contact'}
          ext={'Spotify':'https://open.spotify.com/','YouTube Music':'https://music.youtube.com/','Apple Music':'https://www.apple.com/apple-music/','SoundCloud':'https://soundcloud.com/','Billboard':'https://www.billboard.com/','Rolling Stone':'https://www.rollingstone.com/music/','Pitchfork':'https://pitchfork.com/news/','Variety':'https://variety.com/v/music/','Entertainment Tonight':'https://www.etonline.com/','People':'https://people.com/','Entertainment Weekly':'https://ew.com/','E! News':'https://www.eonline.com/','Hollywood Reporter':'https://www.hollywoodreporter.com/','NTA Entertainment':'https://www.nta.ng/news/entertainment/'}
          def fix(m):
              before, attrs, inner = m.group(1), m.group(2), m.group(3)
              text=re.sub(r'<[^>]+>',' ',inner)
              text=' '.join(html.unescape(text).split())
              dest=None; external=False
              for k,v in nav.items():
                  if text==k: dest=v; break
              if dest is None:
                  for k,v in ext.items():
                      if k in text: dest=v; external=True; break
              if dest is None: return m.group(0)
              if external:
                  if 'target=' not in attrs: attrs += ' target="_blank"'
                  if 'rel=' not in attrs: attrs += ' rel="noopener noreferrer"'
              return before+attrs+'>'+inner+'</a>'
          s=re.sub(r'(<a\b[^>]*?href=")mailto:managementyourdomain@hotmail.com("([^>]*)>)((?:.|\n)*?)</a>', lambda m: fix(type('M',(),{'group':lambda self,i: {1:m.group(1),2:m.group(3),3:m.group(4)}[i]})()), s, flags=re.I)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit link fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore website link destinations'
          git push
