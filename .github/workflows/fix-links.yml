name: Restore website links
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/fix-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore intended link destinations
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          mail='href="mailto:managementyourdomain@hotmail.com"'
          nav=['#main','#home','#home','#about','#media','#explore','#management','#contact']
          ext=['https://open.spotify.com/','https://music.youtube.com/','https://www.apple.com/apple-music/','https://soundcloud.com/','https://www.billboard.com/','https://www.rollingstone.com/music/','https://pitchfork.com/news/','https://variety.com/v/music/','https://www.etonline.com/','https://people.com/','https://ew.com/','https://www.eonline.com/','https://www.hollywoodreporter.com/','https://www.nta.ng/news/entertainment/']
          for url in nav+ext:
              s=s.replace(mail,'href="'+url+'"',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit link fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore website link destinations'
          git push
